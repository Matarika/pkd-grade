<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>ดูผลการเรียน ร.ร.ชุมชนบ้านป่าก่อดำ</title>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #be185d; --primary-light: #fce7f3; --primary-dark: #831843; --accent: #f59e0b;
      --success: #15803d; --success-light: #dcfce7; --danger: #b42318; --danger-light: #fce8e6;
      --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #1f2937; --text-2: #4b5563; --surface: #f9fafb;
      --lv4: #0d366b; --lv3: #1c5cab; --lv2: #cfe1f8; --lv1: #eef3f9;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Thai', 'Sarabun', sans-serif; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; line-height: 1.5; }
    [hidden] { display: none !important; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ----- เข้าสู่ระบบ ----- */
    #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(900px 500px at 15% 0%, #fce7f3 0%, transparent 60%), radial-gradient(800px 500px at 100% 100%, #fef3c7 0%, transparent 55%), #fdf8fb; }
    .login-card { background: var(--card); width: 100%; max-width: 400px; border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px; text-align: center; box-shadow: 0 20px 40px -12px rgba(16,24,40,0.2); }
    .login-card img { width: 112px; height: 112px; object-fit: contain; margin-bottom: 8px; }
    .login-card h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
    .login-card .school { color: var(--text-2); font-size: 0.95rem; margin-bottom: 22px; }
    .field { text-align: left; margin-bottom: 14px; }
    .field label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    .field input { width: 100%; height: 48px; padding: 0 14px; font: inherit; font-size: 1.1rem; letter-spacing: 0.04em; border: 1.5px solid #d1d5db; border-radius: 10px; background: #fff; color: var(--text); }
    .field input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-light); }
    .field .hint { font-size: 0.82rem; color: var(--text-2); margin-top: 4px; }
    .btn-main { width: 100%; height: 48px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 600; font-size: 1.05rem; margin-top: 4px; }
    .btn-main:hover { background: var(--primary-dark); }
    .btn-main:disabled { opacity: 0.6; cursor: wait; }
    .msg { background: var(--danger-light); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; margin-bottom: 14px; text-align: left; }
    .login-foot { font-size: 0.82rem; color: var(--text-2); margin-top: 16px; }

    /* ----- ผลการเรียน ----- */
    .top { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
    .top-in, .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    .top-in { display: flex; align-items: center; gap: 12px; min-height: 64px; }
    .top-in img { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .who { flex: 1; min-width: 0; }
    .who b { display: block; font-size: 1.02rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who span { font-size: 0.85rem; color: var(--text-2); }
    .btn-out { height: 40px; padding: 0 14px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: var(--text); font-size: 0.9rem; flex-shrink: 0; }
    .btn-out:hover { background: var(--surface); }
    .wrap { padding-top: 16px; padding-bottom: 40px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .bar h2 { font-size: 1.15rem; font-weight: 700; }
    .bar select { height: 40px; padding: 0 10px; font: inherit; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: var(--text); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
    .sec-title { font-size: 1.05rem; font-weight: 700; margin: 22px 0 10px; }
    .empty { text-align: center; color: var(--text-2); padding: 36px 16px; }
    .empty b { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }
    .note { font-size: 0.85rem; color: var(--text-2); margin-bottom: 12px; }

    .ab-no { display: inline-block; font-size: 0.8rem; font-weight: 600; color: var(--primary-dark); background: var(--primary-light); border-radius: 999px; padding: 1px 10px; margin-bottom: 6px; }
    .ab-text { font-size: 0.95rem; }
    .ab-text.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .more { border: none; background: none; color: var(--primary); font-size: 0.85rem; font-weight: 600; padding: 6px 0; min-height: 32px; }
    .exp { font-size: 0.85rem; color: var(--text-2); margin-top: 2px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
    th { white-space: nowrap; font-size: 0.8rem; font-weight: 600; color: var(--text-2); text-align: center; padding: 6px 4px; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; padding-left: 0; }
    td { padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center; font-size: 0.93rem; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    td small { display: block; font-size: 0.76rem; color: var(--text-2); }
    .sub { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
    .sub-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
    .sub-grid { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; text-align: center; font-variant-numeric: tabular-nums; }
    .sub-grid > div { background: var(--surface); border-radius: 10px; padding: 8px 4px; }
    .sub-grid > div.yr { background: #fff; box-shadow: inset 0 0 0 1px var(--border); }
    .sub-grid .lbl { display: block; font-size: 0.76rem; color: var(--text-2); margin-bottom: 4px; }
    .sub-grid small { display: block; font-size: 0.78rem; color: var(--text-2); margin-top: 2px; }
    tr.grp td { background: var(--surface); font-size: 0.8rem; font-weight: 600; color: var(--text-2); padding: 5px 8px; text-align: left; }
    .lv { display: inline-block; min-width: 68px; padding: 2px 8px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
    .lv4 { background: var(--lv4); color: #fff; } .lv3 { background: var(--lv3); color: #fff; }
    .lv2 { background: var(--lv2); color: var(--lv4); } .lv1 { background: var(--lv1); color: #334155; box-shadow: inset 0 0 0 1px #c5d2e3; }
    .dash { color: #9ca3af; }
    .pass { color: var(--success); font-weight: 600; } .fail { color: var(--danger); font-weight: 600; }
    .grade { font-weight: 700; font-size: 1.02rem; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .stat span { display: block; font-size: 0.8rem; color: var(--text-2); }
    .stat b { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stat b.sm { font-size: 1rem; font-weight: 600; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .kv:last-child { border-bottom: none; } .kv b { font-weight: 600; text-align: right; }
    .spin { width: 28px; height: 28px; border: 3px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 40px auto; }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (max-width: 420px) { .card { padding: 14px 12px; } .lv { min-width: 0; padding: 2px 7px; font-size: 0.78rem; } .stat b { font-size: 1.25rem; } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }
    @media print { .top { position: static; } .btn-out, .bar select, .more { display: none !important; } .ab-text.clamp { display: block; } .card { break-inside: avoid; } body { background: #fff; } }
  </style>

<script>
// แทน google.script.run ด้วย fetch (credentials: omit = ไม่ส่งคุกกี้ Google จึงไม่ถูกพาไป /u/N/ ของบัญชีที่ล็อกอินค้าง)
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwGzmynx7I8uoGRU7CXArh8unK6ZNGPYgKzY_qqoJShHv_jorVJjTnNObmYFX4NNbEJwQ/exec';
  function R(ok, fail) {
    return { withSuccessHandler: function (f) { return R(f, fail); }, withFailureHandler: function (f) { return R(ok, f); },
      studentView: function (id, pass, year) {
        fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ id: id, pass: pass, year: year || '' }) })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (t) { ok && ok(t); }).catch(function (e) { fail && fail(e); });
      } };
  }
  window.google = { script: { run: R(null, null) } };
})();
</script>

<main id="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <img id="login-logo" alt="">
    <h1>ดูผลการเรียน</h1>
    <div class="school">โรงเรียนชุมชนบ้านป่าก่อดำ</div>
    <div class="msg" id="login-msg" role="alert" hidden></div>
    <div class="field">
      <label for="in-id">รหัสนักเรียน</label>
      <input id="in-id" type="text" inputmode="numeric" maxlength="20" required>
    </div>
    <div class="field">
      <label for="in-pass">วันเกิด 6 หลัก</label>
      <input id="in-pass" type="text" inputmode="numeric" maxlength="6" placeholder="เช่น 210651" required>
      <div class="hint">วัน เดือน และเลขท้ายปีเกิด (พ.ศ.) 2 ตัว เช่น เกิด 21 มิถุนายน 2551 พิมพ์ 210651</div>
    </div>
    <button class="btn-main" id="btn-login" type="submit">ดูผลการเรียน</button>
    <div class="login-foot">เข้าไม่ได้หรือข้อมูลไม่ถูกต้อง กรุณาติดต่อครูประจำชั้น</div>
  </form>
</main>

<div id="result" hidden>
  <header class="top"><div class="top-in">
    <img id="top-logo" alt="">
    <div class="who"><b id="who-name"></b><span id="who-sub"></span></div>
    <button class="btn-out" type="button" onclick="logout()">ออก</button>
  </div></header>
  <main class="wrap">
    <div class="bar"><h2 id="year-title"></h2><select id="year-sel" aria-label="ปีการศึกษา" onchange="load(this.value)" hidden></select></div>
    <div id="content"></div>
  </main>
</div>

<script>
var CRED = null;   // เก็บในหน่วยความจำของหน้านี้เท่านั้น (ปิดหน้า = ออกจากระบบ)
function $(id) { return document.getElementById(id); }
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
if (typeof SCHOOL_LOGO !== 'undefined') { $('login-logo').src = SCHOOL_LOGO; $('top-logo').src = SCHOOL_LOGO; }

$('in-pass').addEventListener('input', function() { this.value = this.value.replace(/\D/g, '').slice(0, 6); });
$('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var id = $('in-id').value.trim(), pass = $('in-pass').value.trim();
  if (!id || pass.length !== 6) { loginMsg('กรุณากรอกรหัสนักเรียน และวันเกิดให้ครบ 6 หลัก'); return; }
  CRED = { id: id, pass: pass }; load('');
});
function loginMsg(t) { var m = $('login-msg'); m.textContent = t || ''; m.hidden = !t; }
function busy(on) { var b = $('btn-login'); b.disabled = on; b.textContent = on ? 'กำลังตรวจสอบ...' : 'ดูผลการเรียน'; }

function load(year) {
  if (!CRED) return;
  var first = $('result').hidden;
  if (first) { busy(true); loginMsg(''); } else { $('content').innerHTML = '<div class="spin" role="status" aria-label="กำลังโหลด"></div>'; }
  google.script.run.withSuccessHandler(function(res) {
    busy(false);
    var d; try { d = JSON.parse(res); } catch (e) { d = { ok: false, msg: 'ระบบขัดข้อง กรุณาลองใหม่ภายหลัง' }; }
    if (!d.ok) { logout(); loginMsg(d.msg); return; }
    show(d);
  }).withFailureHandler(function() {
    busy(false);
    if (first) { CRED = null; loginMsg('เชื่อมต่อไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); }
    else $('content').innerHTML = '<div class="card empty"><b>โหลดข้อมูลไม่สำเร็จ</b>กรุณาตรวจสอบอินเทอร์เน็ตแล้วเลือกปีการศึกษาอีกครั้ง</div>';
  }).studentView(CRED.id, CRED.pass, year || '');
}

function logout() {
  CRED = null; $('result').hidden = true; $('login').hidden = false; $('content').innerHTML = '';
  $('in-pass').value = ''; busy(false); window.scrollTo(0, 0);
}

function show(d) {
  $('login').hidden = true; $('result').hidden = false; $('in-pass').value = '';
  $('who-name').textContent = d.student.name;
  $('who-sub').textContent = 'ชั้น ' + d.student.grade + ' · เลขที่ ' + d.student.num + ' · รหัส ' + d.student.id;
  var sel = $('year-sel');
  sel.innerHTML = d.years.map(function(y) { return '<option value="' + esc(y) + '"' + (y === d.year ? ' selected' : '') + '>ปีการศึกษา ' + esc(y) + '</option>'; }).join('');
  sel.hidden = d.years.length < 2;
  $('year-title').textContent = d.year ? 'ปีการศึกษา ' + d.year + (d.data && d.data.grade ? ' · ' + d.data.grade : '') : 'ผลการเรียน';
  var x = d.data, h;
  if (!x || x.empty) h = '<div class="card empty"><b>ยังไม่ประกาศผลการเรียน</b>' + (d.year ? 'ปีการศึกษา ' + esc(d.year) + ' ยังไม่มีผลการเรียนที่ประกาศ' : 'โรงเรียนยังไม่ได้ประกาศผลการเรียน') + '<br>กรุณากลับมาดูใหม่ภายหลัง</div>';
  else h = x.mode === 'sec' ? secHtml(x) : priHtml(x);
  $('content').innerHTML = h;
  window.scrollTo(0, 0);
}

var LV = { 'เชี่ยวชาญ': 4, 'ชำนาญ': 3, 'พัฒนา': 2, 'เริ่มต้น': 1 };
var DASH = '<span class="dash" aria-label="ยังไม่มีผล">–</span>';
function lvBadge(l) { return LV[l] ? '<span class="lv lv' + LV[l] + '">' + esc(l) + '</span>' : esc(l || ''); }
function lvCell(t, max) { return t ? lvBadge(t.level) + '<small>' + esc(t.score) + '/' + max + '</small>' : DASH; }
function passCell(v) { return (v === 'ผ่าน' || v === 'ผ') ? '<span class="pass">ผ่าน</span>' : ((v === 'ไม่ผ่าน' || v === 'มผ') ? '<span class="fail">ไม่ผ่าน</span>' : DASH); }
function traitCard(x) {
  if (!x.trait && !x.rtw) return '';
  return '<div class="card"><h3>คุณลักษณะและการอ่าน คิด วิเคราะห์ เขียน</h3>' +
    '<div class="kv"><span>คุณลักษณะอันพึงประสงค์</span><b>' + (esc(x.trait) || DASH) + '</b></div>' +
    '<div class="kv"><span>การอ่าน คิด วิเคราะห์ และเขียน</span><b>' + (esc(x.rtw) || DASH) + '</b></div></div>';
}
function toggleText(btn) { var p = btn.previousElementSibling, on = p.classList.toggle('clamp'); btn.textContent = on ? 'อ่านทั้งหมด' : 'ย่อ'; btn.setAttribute('aria-expanded', String(!on)); }

// ----- ประถม -----
function priHtml(x) {
  var t1 = x.terms[1], t2 = x.terms[2], both = t1 && t2;
  var h = '<p class="note">ผลการประเมินตามความสามารถชั้นปี ระดับจากสูงไปต่ำ: ' + ['เชี่ยวชาญ', 'ชำนาญ', 'พัฒนา', 'เริ่มต้น'].map(lvBadge).join(' ') +
          (both ? '' : '<br>ระดับทั้งปีจะแสดงเมื่อประกาศผลครบ 2 ภาคเรียน') + '</p>';
  x.abilities.forEach(function(a) {
    var long = String(a.text || '').length > 150;
    h += '<section class="card"><span class="ab-no">ความสามารถข้อที่ ' + esc(a.no) + '</span>' +
         '<p class="ab-text' + (long ? ' clamp' : '') + '">' + esc(a.text) + '</p>' +
         (long ? '<button class="more" type="button" aria-expanded="false" onclick="toggleText(this)">อ่านทั้งหมด</button>' : '') +
         '<div class="exp">ระดับที่คาดหวัง: ' + esc(a.exp) + '</div>';
    if (!a.subs.length) h += '<p class="exp" style="margin-top:8px;">ยังไม่มีผลการประเมินในข้อนี้</p>';
    a.subs.forEach(function(s) {
      h += '<div class="sub"><div class="sub-name">' + esc(s.name) + '</div><div class="sub-grid">' +
           (t1 ? '<div><span class="lbl">ภาคเรียน 1</span>' + lvCell(s.t1, 50) + '</div>' : '') + (t2 ? '<div><span class="lbl">ภาคเรียน 2</span>' + lvCell(s.t2, 50) + '</div>' : '') +
           (both ? '<div class="yr"><span class="lbl">ทั้งปี</span>' + (s.year ? lvBadge(s.year.level) + '<small>' + esc(s.year.score) + '/100</small><small>' + esc(s.year.dev) + '</small>' : DASH) + '</div>' : '') + '</div></div>';
    });
    h += '</section>';
  });
  if (x.acts.length) {
    h += '<section class="card"><h3>กิจกรรมพัฒนาผู้เรียน</h3><table><thead><tr><th>กิจกรรม</th>' + (t1 ? '<th>ภาคเรียน 1</th>' : '') + (t2 ? '<th>ภาคเรียน 2</th>' : '') + '</tr></thead><tbody>';
    x.acts.forEach(function(a) { h += '<tr><td>' + esc(a.name) + '</td>' + (t1 ? '<td>' + passCell(a.t1) + '</td>' : '') + (t2 ? '<td>' + passCell(a.t2) + '</td>' : '') + '</tr>'; });
    h += '</tbody></table></section>';
  }
  h += traitCard(x);
  if (x.homeroom && x.homeroom.length) h += '<p class="note">ครูประจำชั้น: ' + esc(x.homeroom.join(', ')) + '</p>';
  return h;
}

// ----- มัธยม -----
function gradeCell(g) {
  if (g === null || g === undefined || g === '') return DASH;
  var bad = g === 0 || g === '0' || g === 'ร' || g === 'มส';
  return '<span class="grade' + (bad ? ' fail' : '') + '">' + esc(g) + '</span>';
}
function secHtml(x) {
  var h = '';
  x.terms.forEach(function(t) {
    var cr = t.credits || { basic: {}, extra: {} };
    var studied = (cr.basic.studied || 0) + (cr.extra.studied || 0), earned = (cr.basic.earned || 0) + (cr.extra.earned || 0);
    h += '<h3 class="sec-title">ภาคเรียนที่ ' + esc(t.term) + '</h3><div class="stats">' +
         '<div class="stat"><span>เกรดเฉลี่ย</span>' + (t.gpa === null || t.gpa === undefined ? '<b class="sm">ยังไม่ครบ</b>' : '<b>' + Number(t.gpa).toFixed(2) + '</b>') + '</div>' +
         '<div class="stat"><span>หน่วยกิตที่เรียน</span><b>' + studied + '</b></div><div class="stat"><span>หน่วยกิตที่ได้</span><b>' + earned + '</b></div></div>';
    h += '<section class="card"><table><thead><tr><th>วิชา</th><th>หน่วยกิต</th><th>คะแนน</th><th>ผลการเรียน</th></tr></thead><tbody>';
    var last = '';
    t.subjects.forEach(function(s) {
      if (s.type !== last) { last = s.type; h += '<tr class="grp"><td colspan="4">รายวิชา' + esc(s.type) + '</td></tr>'; }
      h += '<tr><td>' + esc(s.name) + '<small>' + esc(s.id) + '</small></td><td>' + (s.credit || DASH) + '</td><td>' + (s.score === null || s.score === '' ? DASH : esc(s.score)) + '</td><td>' + gradeCell(s.grade) + (s.fixed ? '<small>แก้ตัวแล้ว (เดิม ' + esc(s.fixed) + ')</small>' : '') + '</td></tr>';
    });
    h += '</tbody></table></section>';
    if (t.acts.length) {
      h += '<section class="card"><h3>กิจกรรมพัฒนาผู้เรียน</h3><table><tbody>';
      t.acts.forEach(function(a) { h += '<tr><td>' + esc(a.name) + '</td><td>' + passCell(a.res) + '</td></tr>'; });
      h += '</tbody></table></section>';
    }
    h += traitCard(t);
  });
  return h + '<p class="note">ผลการเรียน: 4 ถึง 1 = ผ่าน · 0 = ไม่ผ่าน · ร = รอการตัดสิน · มส = ไม่มีสิทธิ์สอบ</p>';
}
</script>
</body>
</html>
